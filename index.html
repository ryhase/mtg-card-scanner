<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>MTG Card Scanner</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  background: #111;
  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

header {
  height: 56px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #222;

  font-size: 18px;
  font-weight: bold;
}

#scanner {
  position: relative;

  width: 100%;
  height: calc(100vh - 56px);

  overflow: hidden;
}

#camera {
  width: 100%;
  height: 100%;

  object-fit: cover;

  background: black;
}

#cardFrame {
  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  width: 72vw;

  aspect-ratio: 0.716;

  border: 3px solid white;

  border-radius: 12px;

  box-shadow:
    0 0 0 9999px rgba(0, 0, 0, 0.45);

  pointer-events: none;
}

#status {
  position: absolute;

  top: 15px;
  left: 15px;
  right: 15px;

  padding: 12px;

  border-radius: 8px;

  background:
    rgba(0, 0, 0, 0.75);

  text-align: center;

  font-size: 14px;
}

button {
  border: none;
  border-radius: 10px;

  padding: 16px;

  font-size: 18px;
  font-weight: bold;
}

#startButton,
#scanButton {

  position: absolute;

  left: 50%;

  transform: translateX(-50%);

  width: 80%;
  max-width: 320px;

  background: white;
  color: #111;
}

#startButton {
  top: 50%;

  transform:
    translate(-50%, -50%);
}

#scanButton {
  bottom: 70px;
}

#counter {
  position: absolute;

  bottom: 20px;
  left: 50%;

  transform:
    translateX(-50%);

  padding: 9px 18px;

  border-radius: 20px;

  background:
    rgba(0, 0, 0, 0.75);

  white-space: nowrap;
}

#result {

  display: none;

  position: absolute;

  inset: 0;

  overflow-y: auto;

  background:
    rgba(0, 0, 0, 0.96);

  padding: 20px;
}

#resultCard {

  max-width: 430px;

  margin: 20px auto;
}

#capturedImage {

  display: block;

  width: 65%;

  max-width: 280px;

  margin: 0 auto 20px;

  border-radius: 10px;
}

#cardName {

  text-align: center;

  font-size: 28px;

  font-weight: bold;

  margin: 15px 0;
}

.info {

  background: #222;

  border-radius: 10px;

  padding: 15px;

  line-height: 1.8;

  margin-bottom: 20px;
}

.action {

  display: block;

  width: 100%;

  margin: 12px 0;

  font-size: 18px;
}

#registerButton {

  background: white;
  color: #111;
}

#retryButton {

  background: #444;
  color: white;
}

#error {
  color: #ff7777;
  white-space: pre-wrap;
}

</style>

</head>

<body>

<header>
  MTG Card Scanner
</header>

<div id="scanner">

  <video
    id="camera"
    autoplay
    playsinline>
  </video>

  <div id="cardFrame"></div>

  <div id="status">
    「カメラを起動」を押してください
  </div>

  <button
    id="startButton">
    📷 カメラを起動
  </button>

  <button
    id="scanButton"
    style="display:none">
    🤖 Geminiでカード判定
  </button>

  <div id="counter">
    スキャン済み：0枚
  </div>


  <!-- 結果 -->

  <div id="result">

    <div id="resultCard">

      <img
        id="capturedImage"
        alt="撮影したカード">

      <div id="cardName">
        判定中…
      </div>

      <div
        id="cardInfo"
        class="info">
      </div>

      <div
        id="error">
      </div>

      <button
        id="registerButton"
        class="action">
        ✅ 登録
      </button>

      <button
        id="retryButton"
        class="action">
        🔄 再スキャン
      </button>

    </div>

  </div>

</div>


<canvas
  id="canvas"
  style="display:none">
</canvas>


<script>

/*
 * Google Apps Script Web App
 */
const API_URL =
  "https://script.google.com/macros/s/AKfycbxAV9S-v1dUQeHkPkIG6yNMaRjWEqJGIdX2f4_1Tz4B6hFHqOtSsJjF3KJhHf4oqdlt/exec";

let stream = null;
let lastResult = null;
let scanCount = 0;

/* DOM */
const video =
  document.getElementById(
    "camera"
  );

const status =
  document.getElementById(
    "status"
  );

const startButton =
  document.getElementById(
    "startButton"
  );

const scanButton =
  document.getElementById(
    "scanButton"
  );

const result =
  document.getElementById(
    "result"
  );

const capturedImage =
  document.getElementById(
    "capturedImage"
  );

const cardName =
  document.getElementById(
    "cardName"
  );

const cardInfo =
  document.getElementById(
    "cardInfo"
  );

const errorElement =
  document.getElementById(
    "error"
  );

const counter =
  document.getElementById(
    "counter"
  );
  
const registerButton =
  document.getElementById(
    "registerButton"
  );

const retryButton =
  document.getElementById(
    "retryButton"
  );

const canvas =
  document.getElementById(
    "canvas"
  );


/*
 * カメラ起動
 */

async function startCamera() {
  try {
    status.textContent =
      "カメラを起動しています…";
    
    stream =
      await navigator
        .mediaDevices
        .getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            },
            width: {
              ideal: 1920
            },
            height: {
              ideal: 1080
            }
          },
          audio: false
        });

    video.srcObject =
      stream;

    await video.play();

    startButton.style.display =
      "none";

    scanButton.style.display =
      "block";

    status.textContent =
      "カードを枠内に合わせてください";

  } catch (error) {
    console.error(error);
    
    status.textContent =
      "カメラエラー";
    
    errorElement.textContent =
      error.name +
      "\n" +
      error.message;
  }
}

/*
 * カメラ画像をJPEG化
 */

function captureImage() {

  const width =
    video.videoWidth;

  const height =
    video.videoHeight;


  /*
   * 少し大きめに撮影
   */

  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext("2d");


  ctx.drawImage(

    video,

    0,
    0,

    width,
    height

  );


  /*
   * JPEG品質
   *
   * 0.85くらいなら
   * 十分な画質とサイズ
   */

  return canvas.toDataURL(
    "image/jpeg",
    0.85
  );

}


/*
 * Base64だけ取り出す
 */

function extractBase64(
  dataUrl
) {

  return dataUrl
    .split(",")[1];

}


/*
 * Geminiへ送信
 */
async function identifyCard() {

  try {

    scanButton.disabled = true;

    status.textContent =
      "カード画像を撮影しています…";


    // カメラから画像を取得
    const image =
      captureImage();


    // 撮影画像を結果画面に表示
    capturedImage.src = image;


    status.textContent =
      "Geminiがカードを判定しています…";


    // data:image/jpeg;base64,XXXX
    // からBase64部分だけ取得
    const base64 =
      extractBase64(image);


    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({
            image: base64
          })
        }
      );


    if (!response.ok) {
      throw new Error(
        "HTTPエラー: " +
        response.status
      );
    }


    const data =
      await response.json();


    console.log(
      "Apps Script:",
      data
    );


    if (!data.success) {
      throw new Error(
        data.error ||
        "カード判定に失敗しました"
      );
    }


    lastResult =
      data.result;


    showResult(
      data.result
    );


  } catch (error) {

    console.error(error);

    errorElement.textContent =
      "エラー：\n" +
      error.message;

    cardName.textContent =
      "判定できませんでした";

    result.style.display =
      "block";


  } finally {

    scanButton.disabled = false;

  }
}


/*
 * 結果表示
 */

function showResult(
  data
) {

  result.style.display =
    "block";


  errorElement.textContent =
    "";


  if (
    !data ||
    data.is_mtg_card === false
  ) {

    cardName.textContent =
      "MTGカードを認識できませんでした";

    cardInfo.innerHTML =
      "別の角度から再スキャンしてください。";

    return;

  }


  cardName.textContent =
    data.card_name ||
    "カード名不明";


  cardInfo.innerHTML = `

    <b>セットコード：</b>
    ${escapeHtml(
      data.set_code || "-"
    )}

    <br>

    <b>セット名：</b>
    ${escapeHtml(
      data.set_name || "-"
    )}

    <br>

    <b>コレクター番号：</b>
    ${escapeHtml(
      data.collector_number || "-"
    )}

    <br>

    <b>言語：</b>
    ${escapeHtml(
      data.language || "-"
    )}

    <br>

    <b>信頼度：</b>
    ${
      data.confidence != null
      ? Math.round(
          data.confidence * 100
        ) + "%"
      : "-"
    }

  `;

}


/*
 * HTMLエスケープ
 */

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/*
 * 再スキャン
 */

retryButton.addEventListener(
  "click",

  function() {

    result.style.display =
      "none";

    lastResult =
      null;

    status.textContent =
      "カードを枠内に合わせてください";

  }

);


/*
 * 登録
 *
 * 今はまだSheetsには登録しない。
 * 次の段階で実装する。
 */

registerButton.addEventListener(
  "click",

  async function() {

    if (!lastResult) {
      return;
    }


    try {

      registerButton.disabled =
        true;


      registerButton.textContent =
        "登録中…";


      const response =
        await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body: JSON.stringify({

              action:
                "register",

              card:
                lastResult

            })

          }
        );


      const data =
        await response.json();


      if (!data.success) {

        throw new Error(
          data.error ||
          "登録に失敗しました"
        );

      }


      // カウンター更新
      scanCount++;

      counter.textContent =
        "スキャン済み：" +
        scanCount +
        "枚";


      // 結果画面を閉じる
      result.style.display =
        "none";


      status.textContent =
        "登録しました。次のカードをスキャンしてください";


    } catch (error) {

      console.error(error);

      errorElement.textContent =
        "登録エラー：\n" +
        error.message;


    } finally {

      registerButton.disabled =
        false;

      registerButton.textContent =
        "✅ 登録";

    }

  }
);


/*
 * イベント
 */

startButton.addEventListener(
  "click",
  startCamera
);


scanButton.addEventListener(
  "click",
  identifyCard
);

</script>

</body>

</html>
