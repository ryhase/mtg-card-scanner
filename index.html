<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0">

<title>MTG Card Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  background: #111;
  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

header {

  height: 56px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #222;

  font-weight: bold;
  font-size: 18px;
}

#scanner {

  position: relative;

  width: 100%;
  height: calc(100vh - 56px);

  overflow: hidden;
}

#camera {

  width: 100%;
  height: 100%;

  object-fit: cover;

  background: black;
}

#cardFrame {

  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  width: 72vw;

  aspect-ratio: 0.716;

  border:
    3px solid white;

  border-radius: 12px;

  box-shadow:
    0 0 0 9999px
    rgba(0,0,0,0.45);

  pointer-events: none;
}

#status {

  position: absolute;

  top: 15px;
  left: 15px;
  right: 15px;

  padding: 12px;

  background:
    rgba(0,0,0,0.75);

  border-radius: 8px;

  text-align: center;

  font-size: 14px;
}

button {

  border: none;

  border-radius: 10px;

  padding: 15px;

  font-size: 17px;

  font-weight: bold;
}

#startButton,
#scanButton {

  position: absolute;

  left: 50%;

  transform:
    translateX(-50%);

  width: 80%;
  max-width: 320px;

  background: white;
  color: #111;
}

#startButton {

  top: 50%;

  transform:
    translate(-50%, -50%);
}

#scanButton {

  bottom: 70px;
}

#counter {

  position: absolute;

  bottom: 20px;

  left: 50%;

  transform:
    translateX(-50%);

  padding: 9px 18px;

  border-radius: 20px;

  background:
    rgba(0,0,0,0.75);
}

canvas {

  display: none;
}

#result {

  display: none;

  position: absolute;

  inset: 0;

  background:
    rgba(0,0,0,0.96);

  overflow-y: auto;

  padding: 20px;
}

#resultCard {

  max-width: 420px;

  margin: 20px auto;
}

#cardImage {

  width: 55%;

  max-width: 250px;

  display: block;

  margin: auto;

  border-radius: 10px;
}

#cardName {

  margin-top: 20px;

  text-align: center;

  font-size: 26px;

  font-weight: bold;
}

#ocrText {

  margin-top: 20px;

  padding: 15px;

  background: #222;

  border-radius: 8px;

  word-break: break-word;

  white-space: pre-wrap;
}

#retryButton {

  display: block;

  width: 100%;

  margin-top: 20px;

  background: #444;

  color: white;
}

</style>

</head>

<body>

<header>
MTG Card Scanner
</header>

<div id="scanner">

<video
  id="camera"
  autoplay
  playsinline>
</video>

<div id="cardFrame"></div>

<div id="status">
「カメラを起動」を押してください
</div>

<button id="startButton">
📷 カメラを起動
</button>

<button
  id="scanButton"
  style="display:none">

🔍 カードを読み取る

</button>

<div id="counter">
スキャン済み：0枚
</div>

<canvas id="captureCanvas"></canvas>

<canvas id="cardCanvas"></canvas>

<canvas id="nameCanvas"></canvas>

<div id="result">

<div id="resultCard">

<img
  id="cardImage"
  alt="card">

<div id="cardName">
OCR結果
</div>

<div id="ocrText">
</div>

<button id="retryButton">
再スキャン
</button>

</div>

</div>

</div>


<script>

let stream = null;

let worker = null;


/* DOM */

const video =
document.getElementById(
  "camera"
);

const status =
document.getElementById(
  "status"
);

const startButton =
document.getElementById(
  "startButton"
);

const scanButton =
document.getElementById(
  "scanButton"
);

const result =
document.getElementById(
  "result"
);

const retryButton =
document.getElementById(
  "retryButton"
);


/* カメラ */

async function startCamera() {

try {

status.textContent =
"カメラを起動しています…";

stream =
await navigator
.mediaDevices
.getUserMedia({

video: {

facingMode: {
ideal: "environment"
},

width: {
ideal: 1920
},

height: {
ideal: 1080
}

},

audio: false

});


video.srcObject =
stream;

await video.play();


startButton.style.display =
"none";

scanButton.style.display =
"block";

status.textContent =
"カードを枠内に合わせてください";

}

catch(error) {

console.error(error);

status.innerHTML =
"<b>カメラエラー</b><br>" +
error.name +
"<br>" +
error.message;

}

}


/* OCR */

async function initializeOCR() {

if (worker) {
return;
}

status.textContent =
"OCRエンジンを準備しています…";


worker =
await Tesseract
.createWorker(

"jpn+eng",

1,

{

logger:
function(info) {

if (
info.status &&
info.progress
) {

status.textContent =
"OCR：" +
Math.round(
info.progress * 100
) +
"%";

}

}

}

);


await worker
.setParameters({

tessedit_pageseg_mode:
"7"

});


status.textContent =
"準備完了";

}


/* 撮影 */

function captureFrame() {

const canvas =
document.getElementById(
"captureCanvas"
);

canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;


const ctx =
canvas.getContext("2d");

ctx.drawImage(

video,

0,
0,

canvas.width,
canvas.height

);

return canvas;

}


/*
 * カード部分を切り出す
 *
 * 今回は枠の位置を基準にする。
 */

function extractCard(
source
) {

const sw =
source.width;

const sh =
source.height;


/*
 * 画面中央の
 * カード領域
 */

const cardWidth =
sw * 0.72;

const cardHeight =
cardWidth / 0.716;


const sx =
(sw - cardWidth) / 2;

const sy =
(sh - cardHeight) / 2;


/*
 * 出力サイズ
 */

const outputWidth =
1000;

const outputHeight =
Math.round(
outputWidth / 0.716
);


const canvas =
document.getElementById(
"cardCanvas"
);

canvas.width =
outputWidth;

canvas.height =
outputHeight;


const ctx =
canvas.getContext("2d");


ctx.imageSmoothingEnabled =
true;

ctx.imageSmoothingQuality =
"high";


ctx.drawImage(

source,

sx,
sy,
cardWidth,
cardHeight,

0,
0,

outputWidth,
outputHeight

);


return canvas;

}


/*
 * カード名部分を抽出
 */

function extractName(
cardCanvas
) {

const width =
cardCanvas.width;

const height =
cardCanvas.height;


/*
 * MTGカード上部
 *
 * 少し広めに取る
 */

const x =
width * 0.045;

const y =
height * 0.018;

const w =
width * 0.91;

const h =
height * 0.12;


const canvas =
document.getElementById(
"nameCanvas"
);


/*
 * OCR用に4倍程度
 */

canvas.width =
Math.round(w * 2.5);

canvas.height =
Math.round(h * 2.5);


const ctx =
canvas.getContext("2d");

ctx.imageSmoothingEnabled =
true;

ctx.imageSmoothingQuality =
"high";


ctx.drawImage(

cardCanvas,

x,
y,
w,
h,

0,
0,

canvas.width,
canvas.height

);


return canvas;

}


/*
 * 画像補正
 */

function preprocess(
source,
mode
) {

const canvas =
document.createElement(
"canvas"
);

canvas.width =
source.width;

canvas.height =
source.height;


const ctx =
canvas.getContext(
"2d"
);

ctx.drawImage(
source,
0,
0
);


const image =
ctx.getImageData(

0,
0,

canvas.width,
canvas.height

);

const data =
image.data;


for (
let i = 0;
i < data.length;
i += 4
) {

let r =
data[i];

let g =
data[i + 1];

let b =
data[i + 2];


/*
 * グレースケール
 */

if (
mode === "gray" ||
mode === "binary"
) {

const gray =
0.299 * r +
0.587 * g +
0.114 * b;

r =
gray;

g =
gray;

b =
gray;

}


/*
 * コントラスト強調
 */

if (
mode === "contrast" ||
mode === "binary"
) {

const factor =
1.8;

r =
(
r - 128
) *
factor +
128;

g =
(
g - 128
) *
factor +
128;

b =
(
b - 128
) *
factor +
128;

}


/*
 * 2値化
 */

if (
mode === "binary"
) {

const gray =
(r + g + b) / 3;

const value =
gray > 150
? 255
: 0;

r =
value;

g =
value;

b =
value;

}


/*
 * 範囲制限
 */

data[i] =
Math.max(
0,
Math.min(
255,
r
)
);

data[i + 2] =
Math.max(
  0,
  Math.min(
    255,
    b
  )
);

data[i + 2] =
Math.max(
0,
Math.min(
255,
b
);

}


ctx.putImageData(
image,
0,
0
);


return canvas;

}


/*
 * OCR
 */

async function runOCR(
canvas
) {

const result =
await worker.recognize(
canvas
);

return (
result.data.text || ""
)
.replace(
/[\r\n]+/g,
" "
)
.replace(
/\s+/g,
" "
)
.trim();

}


/*
 * OCR複数パターン
 */

async function recognizeCardName() {

await initializeOCR();


status.textContent =
"カードを撮影しています…";


const source =
captureFrame();


status.textContent =
"カード画像を補正しています…";


const card =
extractCard(
source
);


const name =
extractName(
card
);


/*
 * 3種類の画像でOCR
 */

const normal =
preprocess(
name,
"normal"
);

const gray =
preprocess(
name,
"gray"
);

const contrast =
preprocess(
name,
"contrast"
);


status.textContent =
"カード名を3パターンで認識しています…";


const results = [];


results.push(
await runOCR(
normal
)
);

results.push(
await runOCR(
gray
)
);

results.push(
await runOCR(
contrast
)
);


/*
 * 空文字を除外
 */

const valid =
results.filter(
text =>
text &&
text.length > 0
);


/*
 * 重複除去
 */

const unique =
[
...new Set(valid)
];


console.log(
"OCR results:",
unique
);


return unique;

}


/*
 * 読み取り
 */

scanButton.addEventListener(
"click",

async function() {

try {

scanButton.disabled =
true;


const results =
await recognizeCardName();


result.style.display =
"block";


const ocrText =
document.getElementById(
"ocrText"
);


ocrText.textContent =
results.length
? results.join("\n")
: "認識できませんでした";


const cardName =
document.getElementById(
"cardName"
);


if (
results.length
) {

cardName.textContent =
"OCR候補";

}

else {

cardName.textContent =
"認識できません";

}


status.textContent =
"認識結果を確認してください";

}

catch(error) {

console.error(error);

status.textContent =
"OCRエラー：" +
error.message;

}

finally {

scanButton.disabled =
false;

}

}
);


/*
 * 再スキャン
 */

retryButton.addEventListener(
"click",

function() {

result.style.display =
"none";

status.textContent =
"カードを枠内に合わせてください";

}
);


/*
 * 起動
 */

startButton.addEventListener(
"click",
startCamera
);

</script>

</body>

</html>
